# Minimal single-binary Tempo configuration for the docker-compose stack.
# Traces arrive over OTLP gRPC from the OpenTelemetry Collector and are kept
# on a docker volume.
stream_over_http_enabled: false

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
