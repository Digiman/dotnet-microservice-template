# Datasources Grafana gets provisioned with on startup.
apiVersion: 1

datasources:
  # metrics - collected by the OpenTelemetry Collector, stored by Prometheus
  # the fixed uid is referenced by the provisioned dashboards
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    uid: prometheus
    isDefault: true

  # traces - collected by the OpenTelemetry Collector, stored by Tempo
  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    uid: tempo

  # logs - collected by the OpenTelemetry Collector, stored by Loki
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    uid: loki
