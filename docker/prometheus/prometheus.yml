# Prometheus scrapes the metrics the OpenTelemetry Collector received over OTLP
# (exported by the collector on port 8889 in the Prometheus format).
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: otel-collector
    # The collector's exporter exposes job/instance derived from the OTLP resource
    # (service.name / service.instance.id) - keep them over the scrape target labels
    # so dashboards can filter by the actual service name.
    honor_labels: true
    static_configs:
      - targets: ['otel-collector:8889']
