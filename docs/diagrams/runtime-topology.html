<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Runtime topology — DotNet.ServiceName</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>Runtime topology of the service template</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="runtime-topology-title runtime-topology-desc">
        <title id="runtime-topology-title">Runtime topology of the service template</title>
        <desc id="runtime-topology-desc">Architecture of the docker compose runtime: the ServiceApi exports logs, metrics and traces once over OTLP to a collector, which stores them in Prometheus, Tempo, Loki and the Aspire dashboard, while Grafana queries the backends and Seq receives logs directly.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ============ arrows (drawn before nodes) ============ -->

        <!-- webapp -> seq: logs over the top -->
        <path d="M 140,80 V 72 Q 140,64 148,64 H 772 Q 780,64 780,72 V 80"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="434" y="46" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="460" y="55" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LOGS</text>

        <!-- webapp -> collector: the one OTLP export (headline path) -->
        <line x1="240" y1="116" x2="344" y2="116" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="268" y="96" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="292" y="105" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OTLP ×3</text>

        <!-- collector -> prometheus -->
        <path d="M 390,136 V 208 Q 390,216 382,216 H 148 Q 140,216 140,224 V 280"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="239" y="196" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="265" y="205" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">METRICS</text>

        <!-- collector -> tempo -->
        <path d="M 437,136 V 220 Q 437,228 429,228 H 388 Q 380,228 380,236 V 280"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="388" y="248" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="408" y="257" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TRACES</text>

        <!-- collector -> loki -->
        <path d="M 483,136 V 244 Q 483,252 491,252 H 612 Q 620,252 620,260 V 280"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="540" y="258" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="560" y="267" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LOGS</text>

        <!-- collector -> aspire dashboard -->
        <path d="M 530,136 V 232 Q 530,240 538,240 H 852 Q 860,240 860,248 V 280"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="658" y="220" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="690" y="229" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ALL SIGNALS</text>

        <!-- grafana -> prometheus -->
        <path d="M 422,416 V 384 Q 422,376 414,376 H 148 Q 140,376 140,368 V 352"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="256" y="356" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="280" y="365" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PROMQL</text>

        <!-- grafana -> tempo -->
        <path d="M 480,416 V 396 Q 480,388 472,388 H 388 Q 380,388 380,380 V 352"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="420" y="368" width="50" height="12" rx="2" fill="#f5f5f5"/>
        <text x="445" y="377" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TRACEQL</text>

        <!-- grafana -> loki -->
        <path d="M 538,416 V 408 Q 538,400 530,400 H 628 Q 620,400 620,392 V 352"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="556" y="380" width="46" height="12" rx="2" fill="#f5f5f5"/>
        <text x="579" y="389" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LOGQL</text>

        <!-- ============ nodes ============ -->

        <!-- ServiceApi -->
        <rect x="40" y="80" width="200" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="80" width="200" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="48" y="86" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="62" y="95" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="140" y="122" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ServiceApi</text>
        <text x="140" y="138" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">OTel SDK · Serilog</text>

        <!-- OTel Collector (focal) -->
        <rect x="344" y="80" width="232" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="344" y="80" width="232" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <rect x="352" y="86" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
        <text x="366" y="95" fill="rgba(235,108,54,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OTLP</text>
        <text x="460" y="122" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">OTel Collector</text>
        <text x="460" y="138" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">receives :4317 · :4318</text>

        <!-- Seq -->
        <rect x="688" y="80" width="232" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="688" y="80" width="232" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="696" y="86" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="710" y="95" fill="rgba(79,93,117,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SINK</text>
        <text x="804" y="114" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Seq</text>
        <text x="804" y="130" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">logs · :5341</text>

        <!-- Prometheus -->
        <rect x="40" y="280" width="200" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="280" width="200" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="48" y="286" width="34" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="65" y="295" fill="rgba(79,93,117,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
        <text x="140" y="322" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Prometheus</text>
        <text x="140" y="338" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">metrics · :9090</text>

        <!-- Tempo -->
        <rect x="280" y="280" width="200" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="280" y="280" width="200" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="288" y="286" width="34" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="305" y="295" fill="rgba(79,93,117,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
        <text x="380" y="322" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tempo</text>
        <text x="380" y="338" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">traces · :3200</text>

        <!-- Loki -->
        <rect x="520" y="280" width="200" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="520" y="280" width="200" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="528" y="286" width="34" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="545" y="295" fill="rgba(79,93,117,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
        <text x="620" y="322" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Loki</text>
        <text x="620" y="338" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">logs · :3100</text>

        <!-- Aspire Dashboard -->
        <rect x="760" y="280" width="200" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="760" y="280" width="200" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="768" y="286" width="34" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="785" y="295" fill="rgba(79,93,117,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
        <text x="860" y="322" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Aspire Dashboard</text>
        <text x="860" y="338" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">all signals · :18888</text>

        <!-- Grafana -->
        <rect x="364" y="416" width="232" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="364" y="416" width="232" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="372" y="422" width="20" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="382" y="431" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
        <text x="480" y="454" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Grafana</text>
        <text x="480" y="470" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">dashboards · :3000</text>

        <!-- ============ legend ============ -->

        <line x1="30" y1="556" x2="930" y2="556" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="30" y="573" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

        <rect x="110" y="562" width="12" height="12" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="130" y="572" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">export hub</text>

        <line x1="252" y1="568" x2="296" y2="568" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="306" y="572" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">OTLP export</text>

        <rect x="420" y="562" width="12" height="12" rx="3" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="440" y="572" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">storage / sink</text>

        <rect x="580" y="562" width="12" height="12" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="600" y="572" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">service / UI</text>

        <line x1="730" y1="568" x2="766" y2="568" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="776" y="572" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">signal flow</text>

      </svg>
    </div>
  </div>
</body>
</html>
