services:
  webapp:
    container_name: ServiceApi
    image: ${DOCKER_REGISTRY-}serviceapi
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 5050:8080
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
    depends_on:
      - seq

  seq:
    container_name: service-seq
    image: datalust/seq:2026.1
    environment:
      - ACCEPT_EULA=Y
      # Seq 2026+ requires first-run auth setup; disable it for the local dev sink
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    ports:
      - 5341:80
