services:
  webapp:
    container_name: ServiceApi
    image: ${DOCKER_REGISTRY-}serviceapi
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 5050:8080
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      # telemetry goes once to the local collector, which fans it out to the
      # backends below (Loki, Prometheus, Tempo, Aspire dashboard); the http/protobuf
      # protocol is shared by the OTLP exporter and the Serilog bridge in Program.cs
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
    depends_on:
      - seq
      - otel-collector

  seq:
    container_name: service-seq
    image: datalust/seq:2026.1
    environment:
      - ACCEPT_EULA=Y
      # Seq 2026+ requires first-run auth setup; disable it for the local dev sink
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    ports:
      - 5341:80

  # receives OTLP from the app and fans the signals out to the backends
  otel-collector:
    container_name: service-otel-collector
    image: otel/opentelemetry-collector-contrib:0.161.0
    volumes:
      - ./docker/otel-collector/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - tempo
      - loki
      - aspire-dashboard

  # metrics storage - scrapes the collector's Prometheus exporter
  prometheus:
    container_name: service-prometheus
    image: prom/prometheus:v3.13.4
    ports:
      - 9090:9090
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  # traces storage - receives OTLP gRPC from the collector
  tempo:
    container_name: service-tempo
    image: grafana/tempo:3.0.3
    command: [ "-config.file=/etc/tempo/tempo.yaml" ]
    ports:
      - 3200:3200
    volumes:
      - ./docker/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo

  # logs storage - receives OTLP logs from the collector
  loki:
    container_name: service-loki
    image: grafana/loki:3.7.2
    command: [ "-config.file=/etc/loki/loki-config.yaml" ]
    ports:
      - 3100:3100
    volumes:
      - ./docker/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki

  # the same Aspire dashboard UI as under `aspire run`, fed by the collector
  aspire-dashboard:
    container_name: service-aspire-dashboard
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.5
    ports:
      - 18888:18888
    environment:
      - DASHBOARD__FRONTEND__AUTHMODE=Unsecured
      - DASHBOARD__OTLP__AUTHMODE=Unsecured

  # UI over the stored metrics (Prometheus) and traces (Tempo), no login for local dev
  grafana:
    container_name: service-grafana
    image: grafana/grafana:13.2
    ports:
      - 3000:3000
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

volumes:
  prometheus-data:
  tempo-data:
  loki-data:
  grafana-data:
